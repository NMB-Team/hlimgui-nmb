name: Build

on:
  workflow_dispatch:
  push:
  pull_request:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  windows:
    name: Windows build
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: blytkerchan/devsecops-setup-msvc@v1
        with:
          arch: x64

      - name: Download HashLink
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/HaxeFoundation/hashlink/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -like 'hashlink-*-win.zip' } | Select-Object -First 1
          if (-not $asset) {
            throw 'Could not find a Windows HashLink release asset.'
          }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile 'hashlink-win.zip'
          Expand-Archive -LiteralPath 'hashlink-win.zip' -DestinationPath 'hashlink' -Force

          $hashlinkDir = Get-ChildItem -Path 'hashlink' -Directory | Select-Object -First 1
          if (-not $hashlinkDir) {
            throw 'Could not locate the extracted HashLink directory.'
          }

          "HASHLINK=$($hashlinkDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($hashlinkDir.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build native extension
        run: |
          cmake -S extension -B extension/build -A x64
          cmake --build extension/build --config Release --parallel

      - name: Package release files
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'dist\hlimgui'
          if (Test-Path -LiteralPath 'dist') {
            Remove-Item -LiteralPath 'dist' -Recurse -Force
          }
          New-Item -ItemType Directory -Force $packageDir | Out-Null

          $hdll = Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter 'hlimgui.hdll' -File -Recurse | Select-Object -First 1
          $lib = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'extension\build') -Filter 'hlimgui.lib' -File -Recurse | Select-Object -First 1

          if (-not $hdll) {
            throw 'Missing built hlimgui.hdll.'
          }
          if (-not $lib) {
            throw 'Missing built hlimgui.lib.'
          }

          Copy-Item -LiteralPath $hdll.FullName -Destination $packageDir
          Copy-Item -LiteralPath $lib.FullName -Destination $packageDir

          if (-not (Test-Path -LiteralPath (Join-Path $packageDir 'hlimgui.hdll'))) {
            throw 'Missing packaged hlimgui.hdll.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $packageDir 'hlimgui.lib'))) {
            throw 'Missing packaged hlimgui.lib.'
          }

      - name: Create release zip
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'hlimgui-windows.zip') {
            Remove-Item -LiteralPath 'hlimgui-windows.zip' -Force
          }
          Compress-Archive -Path 'dist\hlimgui\*' -DestinationPath 'hlimgui-windows.zip'

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hlimgui-windows
          path: dist/hlimgui

      - name: Update nightly release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'nightly'
          $asset = 'hlimgui-windows.zip'
          $notes = @'
          Automated Windows build of `hlimgui` using NMB HashLink.

          Download `hlimgui-windows.zip` and extract it where you want to keep the library files.
          '@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if (-not $releaseExists) {
            gh release create $tag $asset `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title 'Nightly Release' `
              --notes $notes `
              --prerelease

            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to create the nightly release.'
            }
            exit 0
          }

          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" `
            -f sha=$env:GITHUB_SHA `
            -F force=true

          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to move the nightly tag.'
          }

          gh release upload $tag $asset `
            --repo $env:GITHUB_REPOSITORY `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to replace the nightly asset.'
          }
