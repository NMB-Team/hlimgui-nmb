name: Build

on:
  workflow_dispatch:
  push:
  pull_request:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  windows:
    name: Windows build
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: blytkerchan/devsecops-setup-msvc@v1
        with:
          arch: x64

      - name: Install NMB HashLink
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = 'NMB-Team/hashlink-nmb'
          $workflow = 'build.yml'
          $artifact = 'windows-vs2026-64'
          $downloadDir = Join-Path $env:RUNNER_TEMP 'hashlink-download'
          $extractDir = Join-Path $env:RUNNER_TEMP 'hashlink-extract'
          $installDir = 'C:\HaxeToolkit\hashlink'

          $runId = $null
          for ($page = 1; $page -le 5 -and -not $runId; $page++) {
            $runsData = gh api "/repos/$repo/actions/workflows/$workflow/runs?branch=master&status=success&per_page=50&page=$page" | ConvertFrom-Json
            foreach ($candidate in @($runsData.workflow_runs | Sort-Object created_at -Descending)) {
              $artifactsData = gh api "/repos/$repo/actions/runs/$($candidate.id)/artifacts" | ConvertFrom-Json
              $match = @($artifactsData.artifacts | Where-Object { $_.name -eq $artifact -and -not $_.expired } | Select-Object -First 1)
              if ($match) {
                $runId = $candidate.id
                break
              }
            }
          }
          if (-not $runId) {
            throw "No non-expired $artifact artifact found in $repo/$workflow."
          }

          New-Item -ItemType Directory -Force $downloadDir | Out-Null
          gh run download $runId --repo $repo --name $artifact --dir $downloadDir

          $zip = Get-ChildItem -LiteralPath $downloadDir -Filter '*.zip' -File -Recurse | Select-Object -First 1
          if ($zip) {
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extractDir -Force
            $sourceRoot = $extractDir
          } else {
            $sourceRoot = $downloadDir
          }

          $hlExe = Get-ChildItem -LiteralPath $sourceRoot -Filter 'hl.exe' -File -Recurse | Select-Object -First 1
          if (-not $hlExe) {
            throw "Downloaded $artifact does not contain hl.exe."
          }

          if (Test-Path -LiteralPath $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force (Split-Path $installDir -Parent) | Out-Null
          Copy-Item -LiteralPath $hlExe.Directory.FullName -Destination $installDir -Recurse -Force

          "HASHLINKPATH=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HASHLINK_PATH=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HASHLINK_BIN=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $installDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$installDir\hl.exe" --version

      - name: Build native extension
        run: |
          cmake -S extension -B extension/build -A x64
          cmake --build extension/build --config Release --parallel

      - name: Package release files
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'dist\hlimgui'
          if (Test-Path -LiteralPath 'dist') {
            Remove-Item -LiteralPath 'dist' -Recurse -Force
          }
          New-Item -ItemType Directory -Force $packageDir | Out-Null

          $hdll = Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter 'hlimgui.hdll' -File -Recurse | Select-Object -First 1
          $lib = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'extension\build') -Filter 'hlimgui.lib' -File -Recurse | Select-Object -First 1

          if (-not $hdll) {
            throw 'Missing built hlimgui.hdll.'
          }
          if (-not $lib) {
            throw 'Missing built hlimgui.lib.'
          }

          Copy-Item -LiteralPath $hdll.FullName -Destination $packageDir
          Copy-Item -LiteralPath $lib.FullName -Destination $packageDir

          if (-not (Test-Path -LiteralPath (Join-Path $packageDir 'hlimgui.hdll'))) {
            throw 'Missing packaged hlimgui.hdll.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $packageDir 'hlimgui.lib'))) {
            throw 'Missing packaged hlimgui.lib.'
          }

      - name: Create release zip
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'hlimgui-windows.zip') {
            Remove-Item -LiteralPath 'hlimgui-windows.zip' -Force
          }
          Compress-Archive -Path 'dist\hlimgui\*' -DestinationPath 'hlimgui-windows.zip'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hlimgui-windows
          path: dist/hlimgui

      - name: Update nightly release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: Nightly Release
          body: |
            Automated Windows build of `hlimgui` using NMB HashLink.

            Download `hlimgui-windows.zip` and extract it where you want to keep the library files.
          files: |
            hlimgui-windows.zip
